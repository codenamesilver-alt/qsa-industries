name: ci

# The database job is the one that matters: it replays every migration into an
# empty database and runs the pgTAP suites, so a migration that only works
# against the already-migrated live project fails here instead.
#
# The browser suites (ui:smoke, ui:lifecycle) are deliberately absent. They drive
# a running Next.js server against a real Supabase project, so they cannot run
# without live credentials. Run them locally against the demo project.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: migrations and pgTAP
    runs-on: ubuntu-latest
    services:
      postgres:
        # The official image ships postgresql-contrib, which is where pg_tap
        # lives. The suites need anon/authenticated/service_role to exist, which
        # scripts/lib/platform-stub.sql creates.
        #
        # Pinned to 17 to match the live project, which reports 17.6. Testing on
        # an older major than production tests a server nobody runs.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax-check the database scripts
        run: |
          for f in scripts/*.mjs scripts/lib/*.mjs; do node --check "$f"; done

      # No db:history-backfill step here on purpose. It repairs a live project's
      # migration history, and this database is empty, so the table it queries
      # does not exist yet. The history shape, the recorded SQL and the naming
      # convention are all asserted by db:verify-fresh during npm test, against
      # a database that was actually built by replaying the migrations.
      - name: pgTAP and fresh-install replay
        run: npm test

  web:
    name: lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # The build only needs these two to be present; they are public anon
      # values inlined into the client bundle. No real credentials belong here.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
