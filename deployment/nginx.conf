# QSA ERP reverse proxy.
#
# Install as /etc/nginx/sites-available/qsa, symlink into sites-enabled, then:
#
#   nginx -t && systemctl reload nginx
#
# Assumes certbot has already issued a certificate for the domain in
# server_name. Obtain it first with:
#
#   certbot --nginx -d your-domain
#
# The certificate directives below are already in the shape certbot writes, so
# `certbot --nginx` will rewrite this file in place. Keep a copy of this
# template elsewhere; do not rely on the live file as the source of truth.

upstream qsa_web {
    server 127.0.0.1:3100;
    keepalive 32;
}

# Connection header values. Uncomment and apply the same limits in the app
# before serving real traffic; the defaults are enough to stop a slow client
# from holding a worker open indefinitely.
#
# limit_req_zone $binary_remote_addr zone=qsa_login:10m rate=10r/m;
# limit_conn_zone $binary_remote_addr zone=qsa_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain;

    # Leave this block in place so certbot can issue and renew over HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain;

    ssl_certificate     /etc/letsencrypt/live/your-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # The app serves its own security headers for Next.js responses. These are
    # the transport-level ones, which belong here.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A sales invoice PDF export is the largest thing this app produces; the
    # default 1 MB is too small for it.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/qsa.access.log;
    error_log  /var/log/nginx/qsa.error.log;

    location / {
        proxy_pass http://qsa_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Keep the upstream connection open between requests, but not
        # indefinitely: a dead worker should be noticed within a minute.
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Next.js serves its own immutable build assets under /_next/static, which
    # carry a content hash in the path and can be cached forever.
    location /_next/static/ {
        proxy_pass http://qsa_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
